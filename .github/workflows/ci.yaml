name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # undici@8 (a direct dependency) requires Node >= 22.19; Node 20
          # fails every suite at import with "markAsUncloneable is not a function".
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # The e2e suite is not wired up here yet, and that is exactly why it rotted:
  # 28 of its 149 tests were failing on main, including every browser test,
  # and nothing surfaced it because this workflow only ever ran the three
  # steps above. The remaining blocker is credentials -- the suite needs a
  # local Supabase (`supabase start`) plus a Clerk *test* instance's
  # pk_test_/sk_test_ keys, and it refuses to run without them by design.
  #
  # To turn it on: add CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and
  # CLERK_FRONTEND_API_DOMAIN as repository secrets pointing at a throwaway
  # Clerk test instance, then uncomment. Do not point them at production: the
  # suite creates and deletes users.
  #
  # e2e:
  #   name: End-to-end
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm exec playwright install --with-deps chromium
  #     - uses: supabase/setup-cli@v1
  #       with:
  #         version: 2.90.0
  #     - run: supabase start
  #     - run: pnpm test:e2e
  #       env:
  #         CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
  #         NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
  #         CLERK_FRONTEND_API_DOMAIN: ${{ secrets.CLERK_TEST_FRONTEND_API_DOMAIN }}
